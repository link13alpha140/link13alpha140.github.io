<h9><U>
Missions :
</h9></U>
<br>
<textarea id="text" name="text" rows="15" cols="120" class="textetest">

 La brigade de gendarmerie maritime de Hyères est implantée sur la base aéronavale éponyme.

 Elle assure :

  - La recherche du renseignement au profit de la Marine nationale,
  - La participation à la Protection et défense (Prodef) de la base en collaboration avec le Bataillon de fusiliers 
    marins (BFM),
  - L'Équipe de sécurisation de navire a passager (Esnap) entre La Tour Fondue et Porquerolles ( sécurisation des 
    navires à passagers à terre et en mer),
  - La protection des emprises de la Marine nationale dépendant de la Base aéronavale,
  - L'accueil des hautes autorités de l’État,
  - La surveillance de différents aéronefs français et étranger en transit sur la Base aéronavale,
  - Toutes les missions dévolues à la gendarmerie nationale.
</textarea>
<br>
<br>

Moyens :
<br></U>
</h9>

<br></U>

 Les personnels ont un permis pistes (Documents qui permet de travailler sur des pistes d'aéroport).
