<h9><U>
Missions :
</h9></U>
<br>
<textarea id="text" name="text" rows="24" cols="120" class="textetest">

 L'activité principale de la brigade de gendarmerie maritime se déroule en mer.

 Elle assure :

 -La surveillance et sauvegarde des approches maritimes,

 -La participation aux opérations de secours en mer,

 -Les investigations en mer lors d'accidents et naufrages,

 -La surveillance des espaces protégés (réserves marines),

 -Le contrôle de la navigation de plaisance (matériels de sécurité, documents administratifs, règle de barre...),

 -Le contrôle de la navigation professionnelle (pêcheurs, barges pour travaux maritimes, plongée pro...),

 -Le contrôle des activités nautiques (location jet ski, club de plongée, locations de navire...),

 -Le contrôle à terre des restaurants et vente des produits de la mer (traçabilité et hygiène des 
  produits marins...),

 -La participation aux exercices avec la Marine Nationale (blanchiment de zones, sécurité de sites sensibles...).
</textarea>
<br>
<br>

Moyens :
<br></U>
</h9>

        Moyens nautiques : - 1 Embarcation type semi-rigide avec moteur 70 Cv,
			   - 1 Embarcation type semi rigide avec moteur de 200 Cv,
			   - 1 Vedette côtière de sureté maritime (VCSM) de 20 mètres avec deux moteurs MAN de 1000 CV 
			     chacun.
 - Divers : 

	- Matériels informatique et de communication (radio, ordinateurs...).
</textarea>
