<h9><U>
Missions :
</h9></U>
<br>
<textarea id="text" name="text" rows="8" cols="120" class="textetest">

 La mission principale de la cellule est le recueil de renseignements afin de déceler en amont toutes menaces 
 potentielles et éviter les troubles à l'ordre publique.

 Après recoupement et analyse approfondie du renseignement obtenu, ils est établi des Fiches de renseignement élaborées
 (FRE), des Fiches de renseignement élaborées confidentielles (FREC) où des Fiches entités (FIE) qui sont transmisse
 aux échelons territoriaux de commandement.
</textarea>
