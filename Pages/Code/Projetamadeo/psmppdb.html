<h9><U>
Missions :
</h9></U>
<br>
<textarea id="text" name="text" rows="17" cols="120" class="textetest">

 Le PSMP a pour vocation de maintenir la sûreté maritime et portuaire dans leur zone d'action.

 L'unité a en charge :

   - La sûreté portuaire.

   - Les contrôles de sûreté.

   - La surveillance du port et du plan d’eau.

   - Les investigations judiciaires.

   - Les escortes de Protection pour les Navires A Passagers (L'EPNAP).

   - L'assistance pour d’autres unités.
</textarea>
<br>
<br>
<h9><U>
Moyens :
<br></U>
</h9>
<textarea id="text" name="text" rows="10" cols="120">
 
 - Mobilité :

        Moyens nautiques : - 1 Embarcation à Fond Rigide avec un moteur 200 Cv (EFR),
			   - 1 Embarcation Sur-motorisée avec 2 moteurs de 300 Cv chacun (ESMP),
			   - 1 Vedette à hydrojet avec 2 moteurs de 380 Cv chacun (VSMP).
 - Divers :

	Équipement lourd de combat.
</textarea>
<br>
<br>
<h9><U>
Effectifs :
<br></U>
</h9>
<textarea id="text" name="text" rows="27" cols="120">

 31 personnels :

  1 Officier, 22 Sous-officier, 8 Gendarmes adjoints volontaires (GAV).


 - Police Judiciaire :

	OPJ : 14 personnels.


 Certains personnels ont les qualifications/formations suivantes :

	- Pilotes d’embarcations,

	- Mécaniciens,

	- Plongeurs,

	- Équipe cynophiles,
	
	- RECOnnaissance et Neutralisation d’Engin EXplosif (Reco-Nedex),

	- Photographie,

	- Langue anglaise internationale.
