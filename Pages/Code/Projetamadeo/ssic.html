<h9><U>
Missions :
</h9></U>
<br>
<textarea id="text" name="text" rows="12" cols="120" class="textetest">
 
 La Section des Systèmes d'Information et de Communication s'occupe de tout le matériel informatique et de 
 communication de l'ensemble des unités GGMARMEDI :

 Assure :

	- La répartition, l'attribution et l'installation du matériel renouvelé ou nouvellement affecté,
	- La maintenance matérielle des différents matériels,
	- Le maintien en condition opérationnelle (MCO) des systèmes,
	- La surveillance du bon fonctionnement des différents réseaux,
	- La MCO et la mise à disposition de matériel lors des éventuelles crises.
</textarea>
