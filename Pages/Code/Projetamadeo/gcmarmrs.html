<h9><U>
Missions :
</h9></U>
<br>
<textarea id="text" name="text" rows="24" cols="120" class="textetest">
 
 Le groupe de commandement (GC) a en charge les parties opérationnelle, administrative et ressource humaine des unités
 placées sous la responsabilité de la compagnie :

 Assure :

	- La gestion des plans d'actions,

	- L'ensemble des tâches administratives,

	- La chancellerie (félicitations, punitions...),

	- Les notations,

	- L'avancement, 

	- Le suivi médical,

	- Le suivi gestion du matériel des unités,

	- La préparation des réunions,

	- Toutes le demandes émanant des unités.
</textarea>
