Missions :
</h9></U>
<br>
<textarea id="text" name="text" rows="13" cols="120" class="textetest">

 Le poste des affaires maritime a pour responsabilité la :

 - Police de la navigation (commerce, plaisance, pêche...),

 - Police des pêches (protection de la ressource halieutique: contrôle des restaurants, poissonneries, criées, 
   navires de pêche...),

 - Police en mer (contrôle des navires, surveillance en mer...),

 - Police de l’environnement marin (protection des espaces et espèces protégés, pollutions, activités prohibées en 
   mer...),
</textarea>
