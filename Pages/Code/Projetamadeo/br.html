<h9><U>
Missions :
</h9></U>
<br>
<textarea id="text" name="text" rows="8" cols="120" class="textetest">

 La brigade de recherche est spécialisé dans les procédures judiciaires.

 Elle est a même de fournir un appui judiciaire à toutes les unités en reprenant à son compte les enquêtes 
 initiées par d'autres unités ou en leur assurant un soutien. 
 Cet unité reçoit également directement des demandes d'un tribunal ou d'un procureur.
 Elle peut aussi mener des enquêtes sur les militaires du GGMARMEDI.
</textarea>
